<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Flow Line Gradient 1 -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748B" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flow-path {
        stroke-dasharray: 8 12;
        animation: flowAnimation 2.8s linear infinite;
      }
      .flow-path-reverse {
        stroke-dasharray: 6 10;
        animation: flowReverse 3.5s linear infinite;
      }
      .node-pulse {
        animation: pulseEffect 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .card-float {
        animation: cardFloatEffect 4s ease-in-out infinite alternate;
      }
      .card-float-delayed {
        animation: cardFloatEffect 4s ease-in-out infinite alternate 2s;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .text-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #E2E8F0;
      }
      .text-node {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #CBD5E1;
      }

      @keyframes flowAnimation {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowReverse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 40; }
      }
      @keyframes pulseEffect {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes cardFloatEffect {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Blobs in background -->
  <circle cx="200" cy="180" r="140" fill="#38BDF8" fill-opacity="0.08" filter="url(#pulseGlow)" />
  <circle cx="650" cy="120" r="160" fill="#818CF8" fill-opacity="0.09" filter="url(#pulseGlow)" />
  <circle cx="1020" cy="220" r="150" fill="#C084FC" fill-opacity="0.08" filter="url(#pulseGlow)" />

  <!-- Dynamic Animated DAG Flow Lines (Background Layer) -->
  <g opacity="0.85">
    <!-- Connecting Curved Pipeline Beams -->
    <path d="M 120 285 C 220 285, 220 250, 320 250" fill="none" stroke="url(#flowGrad1)" stroke-width="3" class="flow-path" filter="url(#glow)" />
    <path d="M 320 250 C 420 250, 430 310, 530 310" fill="none" stroke="url(#flowGrad1)" stroke-width="3" class="flow-path" filter="url(#glow)" />
    <path d="M 530 310 C 630 310, 640 250, 740 250" fill="none" stroke="url(#flowGrad1)" stroke-width="3" class="flow-path" filter="url(#glow)" />
    <path d="M 740 250 C 830 250, 850 300, 940 300" fill="none" stroke="url(#flowGrad1)" stroke-width="3" class="flow-path" filter="url(#glow)" />
    <path d="M 940 300 C 1020 300, 1030 260, 1100 260" fill="none" stroke="url(#flowGrad1)" stroke-width="3" class="flow-path" filter="url(#glow)" />

    <!-- Secondary feedback/evaluation branching loop -->
    <path d="M 740 250 C 680 205, 450 205, 330 245" fill="none" stroke="#F472B6" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.6" class="flow-path-reverse" />
  </g>

  <!-- Interactive DAG Stage Nodes (Visual Pipeline Elements) -->
  <!-- Stage 1: Data Ingestion -->
  <g class="card-float" transform="translate(60, 260)">
    <rect width="125" height="46" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="22" cy="23" r="7" fill="#38BDF8" fill-opacity="0.3" />
    <circle cx="22" cy="23" r="4" fill="#38BDF8" />
    <text x="38" y="27" class="text-node">Data Ingestion</text>
  </g>

  <!-- Stage 2: Feature Store -->
  <g class="card-float-delayed" transform="translate(260, 225)">
    <rect width="125" height="46" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="22" cy="23" r="7" fill="#818CF8" fill-opacity="0.3" />
    <circle cx="22" cy="23" r="4" fill="#818CF8" />
    <text x="38" y="27" class="text-node">Feature Store</text>
  </g>

  <!-- Stage 3: Distributed Train -->
  <g class="card-float" transform="translate(470, 285)">
    <rect width="135" height="46" rx="10" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="22" cy="23" r="7" fill="#A78BFA" fill-opacity="0.3" />
    <circle cx="22" cy="23" r="4" fill="#A78BFA" />
    <text x="38" y="27" class="text-node">Distributed Train</text>
  </g>

  <!-- Stage 4: Model Eval &amp; Test -->
  <g class="card-float-delayed" transform="translate(680, 225)">
    <rect width="130" height="46" rx="10" fill="url(#cardGrad)" stroke="#C084FC" stroke-width="1.5" />
    <circle cx="22" cy="23" r="7" fill="#C084FC" fill-opacity="0.3" />
    <circle cx="22" cy="23" r="4" fill="#C084FC" />
    <text x="38" y="27" class="text-node">Model Eval &amp; Test</text>
  </g>

  <!-- Stage 5: Model Registry -->
  <g class="card-float" transform="translate(880, 275)">
    <rect width="125" height="46" rx="10" fill="url(#cardGrad)" stroke="#F472B6" stroke-width="1.5" />
    <circle cx="22" cy="23" r="7" fill="#F472B6" fill-opacity="0.3" />
    <circle cx="22" cy="23" r="4" fill="#F472B6" />
    <text x="38" y="27" class="text-node">Model Registry</text>
  </g>

  <!-- Stage 6: Serving &amp; Monitor -->
  <g class="card-float-delayed" transform="translate(1040, 235)">
    <rect width="135" height="46" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5" />
    <circle cx="22" cy="23" r="7" fill="#34D399" fill-opacity="0.3" />
    <circle cx="22" cy="23" r="4" fill="#34D399" />
    <text x="38" y="27" class="text-node">Serving &amp; Monitor</text>
  </g>

  <!-- Pulsing Hub Nodes on Connectors -->
  <circle cx="320" cy="250" r="5" fill="#38BDF8" class="node-pulse" />
  <circle cx="530" cy="310" r="5" fill="#818CF8" class="node-pulse" />
  <circle cx="740" cy="250" r="5" fill="#A78BFA" class="node-pulse" />
  <circle cx="940" cy="300" r="5" fill="#F472B6" class="node-pulse" />

  <!-- Solid Foreground Backdrop Plate for Text (Ensures 100% Readability &amp; No Obscuration) -->
  <rect x="50" y="32" width="1100" height="150" rx="16" fill="#0B1120" fill-opacity="0.78" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

  <!-- Header Category Badge -->
  <g transform="translate(75, 48)">
    <rect width="215" height="26" rx="13" fill="#1E293B" stroke="#6366F1" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22C55E" />
    <text x="26" y="17" class="text-badge" fill="#A5B4FC">MLOPS &amp; DATA PIPELINES</text>
  </g>

  <!-- Feature Pills on Right Side of Header -->
  <g transform="translate(680, 48)">
    <rect width="135" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="14" y="17" class="text-badge" fill="#BAE6FD">⚙️ Dynamic DAGs</text>

    <rect x="145" width="145" height="26" rx="13" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8" />
    <text x="159" y="17" class="text-badge" fill="#DDD6FE">☸️ Kubernetes Native</text>

    <rect x="300" width="125" height="26" rx="13" fill="#1E293B" stroke="#34D399" stroke-width="0.8" />
    <text x="314" y="17" class="text-badge" fill="#A7F3D0">🚀 Multi-Cloud</text>
  </g>

  <!-- Foreground Title -->
  <text x="75" y="118" class="text-title" fill="url(#titleGrad)">Awesome ML Pipelines &amp; Orchestration</text>

  <!-- Foreground Subtitle -->
  <text x="75" y="152" class="text-sub">Curated Index of Distributed Compute, Workflow Engines &amp; Modern MLOps Schedulers</text>
</svg>
